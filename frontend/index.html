<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工艺规划与资源优化系统</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f4f7fb;color:#0f172a}
    .app{max-width:1400px;margin:0 auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}
    h1,h2,h3{margin:0 0 12px}.muted{color:#64748b;font-size:13px}.health{padding:10px 14px;border-radius:999px;background:#fff;border:1px solid #dbe2ea}
    .tabs{display:flex;gap:8px;margin-bottom:18px}.tab{border:none;padding:10px 16px;border-radius:999px;background:#dbe2ea;font-weight:700;cursor:pointer}.tab.active{background:#0f766e;color:#fff}
    .panel{display:none}.panel.active{display:block}.grid{display:grid;gap:16px}.two{grid-template-columns:1fr 1fr}.card{background:#fff;border:1px solid #dbe2ea;border-radius:16px;padding:18px;box-shadow:0 10px 24px rgba(15,23,42,.05)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.one{grid-template-columns:1fr}label{display:block;font-size:13px;font-weight:700;margin:8px 0 6px}
    input,select{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    button{border:none;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}.primary{background:#0f766e;color:#fff}.secondary{background:#e2e8f0}.danger{background:#fee2e2;color:#b91c1c}
    .small{padding:6px 10px;font-size:12px}table{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top}
    th{font-size:12px;color:#64748b;text-transform:uppercase}.alert{display:none;margin-bottom:16px;padding:12px 14px;border-radius:12px}.alert.show{display:block}.alert.error{background:#fef2f2;color:#b91c1c}.alert.success{background:#f0fdf4;color:#15803d}
    .empty{color:#94a3b8;padding:8px 0}.list{display:grid;gap:8px}.item{border:1px solid #e2e8f0;border-radius:12px;padding:12px}.hero{padding:18px;border-radius:16px;background:linear-gradient(135deg,#0f766e,#0891b2);color:#fff}
    .hero .value{font-size:42px;font-weight:900}.chip{display:inline-block;padding:4px 10px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:700;margin:4px 6px 0 0}
    .gantt{display:grid;gap:12px}.gantt-head,.gantt-row{display:grid;grid-template-columns:180px minmax(0,1fr);gap:12px;align-items:center}.gantt-label{font-size:13px;font-weight:700;color:#0f172a}
    .gantt-axis,.gantt-track{position:relative;min-height:38px;border-radius:12px;background:linear-gradient(180deg,#f8fafc,#eef2f7);border:1px solid #dbe2ea;overflow:hidden}
    .gantt-axis{min-height:32px}.gantt-ticks,.gantt-bars{position:relative;height:100%}.tick,.bar{position:absolute}.tick{top:0;bottom:0;border-left:1px dashed #cbd5e1}
    .tick span{position:absolute;top:6px;left:6px;font-size:11px;color:#64748b;background:rgba(248,250,252,.9);padding:0 4px}.bar{top:6px;bottom:6px;border-radius:10px;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:6px 10px;font-size:12px;font-weight:700;display:flex;align-items:center;box-shadow:0 8px 16px rgba(15,118,110,.18)}
    .bar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar-idle{background:linear-gradient(135deg,#475569,#64748b)}
    @media(max-width:1100px){.two,.row{grid-template-columns:1fr}}
    @media(max-width:700px){.gantt-head,.gantt-row{grid-template-columns:1fr}.gantt-label{margin-bottom:4px}}
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div>
        <h1>工艺规划与资源优化系统</h1>
        <div class="muted">在前端维护设备、状态、活动和资源，并直接发起求解。</div>
      </div>
      <div id="health" class="health">正在检测服务</div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="data">数据管理</button>
      <button class="tab" data-tab="solve">求解</button>
    </div>
    <div id="alert" class="alert"></div>

    <section id="data" class="panel active">
      <div class="grid two">
        <div class="card">
          <h2>设备类型</h2>
          <div class="row">
            <div><label>编码</label><input id="mtCode"></div>
            <div><label>名称</label><input id="mtName"></div>
          </div>
          <div><label>说明</label><input id="mtDesc"></div>
          <div class="btns">
            <button class="primary" onclick="saveMachineType()">保存</button>
            <button class="secondary" onclick="resetMachineType()">清空</button>
          </div>
          <table><thead><tr><th>设备类型</th><th>操作</th></tr></thead><tbody id="mtTable"></tbody></table>
        </div>

        <div class="card">
          <h2>设备实例</h2>
          <div class="row">
            <div><label>设备类型</label><select id="mType"></select></div>
            <div><label>设备编码</label><input id="mCode"></div>
            <div><label>设备名称</label><input id="mName"></div>
            <div><label>位置</label><input id="mLoc"></div>
          </div>
          <div class="btns">
            <button class="primary" onclick="saveMachine()">保存</button>
            <button class="secondary" onclick="resetMachine()">清空</button>
          </div>
          <table><thead><tr><th>设备</th><th>操作</th></tr></thead><tbody id="mTable"></tbody></table>
        </div>
      </div>

      <div class="grid two" style="margin-top:16px">
        <div class="card">
          <h2>状态特征</h2>
          <div class="row">
            <div><label>设备类型</label><select id="fdType" onchange="loadFeatureDefs()"></select></div>
            <div><label>特征键</label><input id="fdKey"></div>
            <div><label>显示名称</label><input id="fdName"></div>
            <div><label>值类型</label><select id="fdValueType"><option value="enum">枚举</option><option value="string">字符串</option><option value="number">数字</option><option value="boolean">布尔</option></select></div>
          </div>
          <div><label>枚举值（逗号分隔）</label><input id="fdValues" placeholder="例如 cold, hot"></div>
          <div class="btns">
            <button class="primary" onclick="saveFeatureDef()">保存</button>
            <button class="secondary" onclick="resetFeatureDef()">清空</button>
          </div>
          <table><thead><tr><th>特征</th><th>操作</th></tr></thead><tbody id="fdTable"></tbody></table>
        </div>

        <div class="card">
          <h2>状态管理</h2>
          <div class="row">
            <div><label>设备</label><select id="stateMachine" onchange="onStateMachineChange()"></select></div>
            <div><label>状态类型</label><select id="stateType"><option value="current">current</option><option value="target">target</option><option value="snapshot">snapshot</option></select></div>
          </div>
          <div><label>状态名称</label><input id="stateLabel"></div>
          <div id="stateFeatures" class="row"></div>
          <div class="btns">
            <button class="primary" onclick="saveState()">保存</button>
            <button class="secondary" onclick="resetState()">清空</button>
          </div>
          <table><thead><tr><th>状态</th><th>操作</th></tr></thead><tbody id="stateTable"></tbody></table>
        </div>
      </div>

      <div class="grid two" style="margin-top:16px">
        <div class="card">
          <h2>活动规则</h2>
          <div class="row">
            <div><label>设备类型</label><select id="ruleType" onchange="refreshRuleFeatureSelects()"></select></div>
            <div><label>活动编码</label><input id="ruleCode"></div>
            <div><label>活动名称</label><input id="ruleName"></div>
            <div><label>时长（分钟）</label><input id="ruleDuration" type="number" min="1" value="30"></div>
          </div>
          <div><label>描述</label><input id="ruleDesc"></div>
          <div class="btns">
            <button class="secondary small" onclick="addPre()">新增前置条件</button>
            <button class="secondary small" onclick="addEff()">新增执行效果</button>
            <button class="secondary small" onclick="addReq()">新增资源需求</button>
          </div>
          <h3>前置条件</h3><div id="preList" class="list"></div>
          <h3>执行效果</h3><div id="effList" class="list"></div>
          <h3>资源需求</h3><div id="reqList" class="list"></div>
          <div class="btns">
            <button class="primary" onclick="saveRule()">保存</button>
            <button class="secondary" onclick="resetRule()">清空</button>
          </div>
        </div>

        <div class="card">
          <h2>活动列表</h2>
          <div><label>设备类型</label><select id="ruleListType" onchange="loadRules()"></select></div>
          <table><thead><tr><th>活动</th><th>操作</th></tr></thead><tbody id="ruleTable"></tbody></table>
        </div>
      </div>

      <div class="card" style="margin-top:16px">
        <h2>资源管理</h2>
        <div class="grid two">
          <div>
            <div class="row">
              <div><label>资源编码</label><input id="resCode"></div>
              <div><label>资源名称</label><input id="resName"></div>
              <div><label>资源类型</label><input id="resType"></div>
              <div><label>容量</label><input id="resCap" type="number" min="1" value="1"></div>
            </div>
            <div><label>是否可用</label><select id="resAvail"><option value="true">可用</option><option value="false">不可用</option></select></div>
            <div class="btns">
              <button class="primary" onclick="saveResource()">保存</button>
              <button class="secondary" onclick="resetResource()">清空</button>
            </div>
          </div>
          <div><table><thead><tr><th>资源</th><th>操作</th></tr></thead><tbody id="resTable"></tbody></table></div>
        </div>
      </div>
    </section>

    <section id="solve" class="panel">
      <div class="grid two">
        <div class="card">
          <h2>发起求解</h2>
          <div><label>设备</label><select id="solveMachine" onchange="loadSolveStates()"></select></div>
          <div><label>当前状态</label><select id="solveCurrent"></select></div>
          <div><label>目标状态</label><select id="solveTarget"></select></div>
          <div><label>优化目标</label><select id="solveObjective"><option value="minimize_makespan">最小化总工期</option></select></div>
          <div class="btns"><button class="primary" onclick="runSolve()">开始求解</button><button class="secondary" onclick="loadSolveMachines()">刷新</button></div>
        </div>
        <div class="grid">
          <div class="hero"><div class="muted" style="color:rgba(255,255,255,.85)">总工期</div><div id="makespan" class="value">-</div><div>分钟</div></div>
          <div class="card"><h2>Gantt</h2><div id="gantt"><div class="empty">No schedule yet.</div></div></div>
          <div class="card"><h2>任务结果</h2><div id="tasks" class="list"><div class="empty">尚未执行求解。</div></div></div>
          <div class="card"><h2>并行组</h2><div id="parallel"><div class="empty">尚未执行求解。</div></div></div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const ORIGIN=(location.protocol==="http:"||location.protocol==="https:")?location.origin:"http://localhost:8000";
    const API=`${ORIGIN}/api/v1`, HEALTH=`${ORIGIN}/health`;
    const S={mts:[],ms:[],fds:[],states:[],rules:[],resources:[],solveStates:[]};
    const E={mt:null,m:null,fd:null,state:null,rule:null,res:null};
    const q=id=>document.getElementById(id);
    let toastTimer=null;
    const toast=(type,msg)=>{if(toastTimer)clearTimeout(toastTimer);q("alert").className=`alert ${type} show`;q("alert").textContent=msg;toastTimer=setTimeout(clearToast,3200)};
    const clearToast=()=>{q("alert").className="alert";q("alert").textContent=""};
    async function req(path,opt={}){const r=await fetch(API+path,{headers:{"Content-Type":"application/json"},...opt});if(r.status===204)return null;const text=await r.text();const d=text?JSON.parse(text):null;if(!r.ok)throw new Error((d&&d.error_message)||(d&&d.detail)||text||`HTTP ${r.status}`);return d}
    function setOptions(id,arr,val,label,placeholder="请选择"){const el=q(id),cur=el.value;el.innerHTML=`<option value="">${placeholder}</option>`;arr.forEach(x=>el.insertAdjacentHTML("beforeend",`<option value="${x[val]}">${label(x)}</option>`));if([...el.options].some(o=>o.value===cur))el.value=cur}
    function featureDefs(mtId){const x=S.mts.find(i=>String(i.id)===String(mtId));return x?(x.feature_defs||[]):[]}
    function syncEditState(key,items,idField,resetFn){if(!E[key])return;if(!items.some(x=>String(x[idField])===String(E[key])))resetFn()}
    function bindTabs(){document.querySelectorAll(".tab").forEach(btn=>btn.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));btn.classList.add("active");q(btn.dataset.tab).classList.add("active")})}
    async function health(){try{const r=await fetch(HEALTH),d=await r.json();q("health").textContent=`服务正常 · v${d.version}`}catch(e){q("health").textContent="服务不可用"}}

    async function loadMachineTypes(){S.mts=await req("/machine-types");syncEditState("mt",S.mts,"id",resetMachineType);renderMachineTypes();["mType","fdType","ruleType","ruleListType"].forEach(id=>setOptions(id,S.mts,"id",x=>`${x.name} (${x.code})`))}
    function renderMachineTypes(){q("mtTable").innerHTML=S.mts.length?S.mts.map(x=>`<tr><td><strong>${x.name}</strong><div class="muted">${x.code}${x.description?` · ${x.description}`:""}</div></td><td><button class="secondary small" onclick="editMachineType(${x.id})">编辑</button> <button class="danger small" onclick="deleteMachineType(${x.id})">删除</button></td></tr>`).join(""):`<tr><td colspan="2" class="empty">还没有设备类型。</td></tr>`}
    async function saveMachineType(){const p={code:q("mtCode").value.trim(),name:q("mtName").value.trim(),description:q("mtDesc").value.trim()||null};if(!p.code||!p.name)return toast("error","设备类型编码和名称不能为空。");try{E.mt?await req(`/machine-types/${E.mt}`,{method:"PUT",body:JSON.stringify(p)}):await req("/machine-types",{method:"POST",body:JSON.stringify(p)});resetMachineType();await reloadCore();toast("success","设备类型已保存。")}catch(e){toast("error",e.message)}}
    function editMachineType(id){const x=S.mts.find(i=>i.id===id);if(!x)return;E.mt=id;q("mtCode").value=x.code;q("mtName").value=x.name;q("mtDesc").value=x.description||""}
    async function deleteMachineType(id){if(!confirm("确定删除这个设备类型吗？"))return;try{await req(`/machine-types/${id}`,{method:"DELETE"});await reloadCore();toast("success","设备类型已删除。")}catch(e){toast("error",e.message)}}
    function resetMachineType(){E.mt=null;q("mtCode").value="";q("mtName").value="";q("mtDesc").value=""}

    async function loadMachines(){S.ms=await req("/machines");syncEditState("m",S.ms,"id",resetMachine);renderMachines();["stateMachine","solveMachine"].forEach(id=>setOptions(id,S.ms,"id",x=>`${x.name} (${x.code})`))}
    function renderMachines(){q("mTable").innerHTML=S.ms.length?S.ms.map(x=>`<tr><td><strong>${x.name}</strong><div class="muted">${x.code} · ${x.machine_type_code||"-"}${x.location?` · ${x.location}`:""}</div></td><td><button class="secondary small" onclick="editMachine(${x.id})">编辑</button> <button class="danger small" onclick="deleteMachine(${x.id})">删除</button></td></tr>`).join(""):`<tr><td colspan="2" class="empty">还没有设备。</td></tr>`}
    async function saveMachine(){const p={machine_type_id:Number(q("mType").value),code:q("mCode").value.trim(),name:q("mName").value.trim(),location:q("mLoc").value.trim()||null};if(!p.machine_type_id||!p.code||!p.name)return toast("error","设备类型、编码、名称不能为空。");try{E.m?await req(`/machines/${E.m}`,{method:"PUT",body:JSON.stringify(p)}):await req("/machines",{method:"POST",body:JSON.stringify(p)});resetMachine();await reloadCore();toast("success","设备已保存。")}catch(e){toast("error",e.message)}}
    function editMachine(id){const x=S.ms.find(i=>i.id===id);if(!x)return;E.m=id;q("mType").value=x.machine_type_id;q("mCode").value=x.code;q("mName").value=x.name;q("mLoc").value=x.location||""}
    async function deleteMachine(id){if(!confirm("确定删除这个设备吗？"))return;try{await req(`/machines/${id}`,{method:"DELETE"});await reloadCore();toast("success","设备已删除。")}catch(e){toast("error",e.message)}}
    function resetMachine(){E.m=null;q("mType").value="";q("mCode").value="";q("mName").value="";q("mLoc").value=""}

    async function loadFeatureDefs(){const mtId=q("fdType").value;if(!mtId){S.fds=[];resetFeatureDef();q("fdTable").innerHTML=`<tr><td colspan="2" class="empty">请先选择设备类型。</td></tr>`;return}S.fds=await req(`/machine-types/${mtId}/feature-defs`);syncEditState("fd",S.fds,"id",resetFeatureDef);q("fdTable").innerHTML=S.fds.length?S.fds.map(x=>{const av=x.allowed_values||{};const vals=(av.values||av.options||[]).join(", ");return `<tr><td><strong>${x.feature_name||x.feature_key}</strong><div class="muted">${x.feature_key} · ${x.value_type}${vals?` · ${vals}`:""}</div></td><td><button class="secondary small" onclick="editFeatureDef(${x.id})">编辑</button> <button class="danger small" onclick="deleteFeatureDef(${x.id})">删除</button></td></tr>`}).join(""):`<tr><td colspan="2" class="empty">还没有特征定义。</td></tr>`}
    async function saveFeatureDef(){const mtId=Number(q("fdType").value),vals=q("fdValues").value.split(",").map(x=>x.trim()).filter(Boolean),p={machine_type_id:mtId,feature_key:q("fdKey").value.trim(),feature_name:q("fdName").value.trim()||null,value_type:q("fdValueType").value,allowed_values:vals.length?{values:vals}:null};if(!mtId||!p.feature_key)return toast("error","请先选择设备类型并填写特征键。");try{E.fd?await req(`/feature-defs/${E.fd}`,{method:"PUT",body:JSON.stringify({feature_key:p.feature_key,feature_name:p.feature_name,value_type:p.value_type,allowed_values:p.allowed_values})}):await req(`/machine-types/${mtId}/feature-defs`,{method:"POST",body:JSON.stringify(p)});resetFeatureDef();await reloadCore();q("fdType").value=mtId;await loadFeatureDefs();onStateMachineChange();refreshRuleFeatureSelects();toast("success","特征定义已保存。")}catch(e){toast("error",e.message)}}
    function editFeatureDef(id){const x=S.fds.find(i=>i.id===id);if(!x)return;const av=x.allowed_values||{};E.fd=id;q("fdKey").value=x.feature_key;q("fdName").value=x.feature_name||"";q("fdValueType").value=x.value_type;q("fdValues").value=(av.values||av.options||[]).join(", ")}
    async function deleteFeatureDef(id){if(!confirm("确定删除这个特征定义吗？"))return;try{await req(`/feature-defs/${id}`,{method:"DELETE"});await reloadCore();await loadFeatureDefs();onStateMachineChange();refreshRuleFeatureSelects();toast("success","特征定义已删除。")}catch(e){toast("error",e.message)}}
    function resetFeatureDef(){E.fd=null;q("fdKey").value="";q("fdName").value="";q("fdValueType").value="enum";q("fdValues").value=""}

    function renderStateFeatureFields(){const machine=S.ms.find(i=>String(i.id)===q("stateMachine").value),box=q("stateFeatures");box.innerHTML="";if(!machine)return box.innerHTML='<div class="empty">请先选择设备。</div>';const defs=featureDefs(machine.machine_type_id);if(!defs.length)return box.innerHTML='<div class="empty">当前设备类型还没有特征定义。</div>';defs.forEach(f=>{const av=f.allowed_values||{};const vals=av.values||av.options||[];box.insertAdjacentHTML("beforeend",`<div><label>${f.feature_name||f.feature_key}</label>${f.value_type==="enum"&&vals.length?`<select data-key="${f.feature_key}">${vals.map(v=>`<option value="${v}">${v}</option>`).join("")}</select>`:`<input data-key="${f.feature_key}">`}</div>`)})}
    async function onStateMachineChange(){renderStateFeatureFields();await loadStates()}
    async function loadStates(){const machineId=q("stateMachine").value;if(!machineId){S.states=[];resetState();q("stateTable").innerHTML=`<tr><td colspan="2" class="empty">请先选择设备。</td></tr>`;return}const d=await req(`/machines/${machineId}/states`);S.states=d.states||[];syncEditState("state",S.states,"state_id",resetState);q("stateTable").innerHTML=S.states.length?S.states.map(x=>`<tr><td><strong>${x.label||"未命名状态"}</strong><div class="muted">${x.state_type} · ${Object.entries(x.features||{}).map(([k,v])=>`${k}:${v}`).join(" / ")}</div></td><td><button class="secondary small" onclick="editState(${x.state_id})">编辑</button> <button class="danger small" onclick="deleteState(${x.state_id})">删除</button></td></tr>`).join(""):`<tr><td colspan="2" class="empty">还没有状态。</td></tr>`;if(String(q("solveMachine").value)===String(machineId))await loadSolveStates()}
    function collectStateFeatures(){const o={};document.querySelectorAll("#stateFeatures [data-key]").forEach(el=>o[el.dataset.key]=el.value);return o}
    async function saveState(){const machineId=Number(q("stateMachine").value),p={machine_id:machineId,state_type:q("stateType").value,label:q("stateLabel").value.trim()||null,features:collectStateFeatures()};if(!machineId||!p.label)return toast("error","请先选择设备并填写状态名称。");try{E.state?await req(`/states/${E.state}`,{method:"PUT",body:JSON.stringify({state_type:p.state_type,label:p.label,features:p.features})}):await req(`/machines/${machineId}/states`,{method:"POST",body:JSON.stringify(p)});resetState();await loadStates();await loadSolveMachines();toast("success","状态已保存。")}catch(e){toast("error",e.message)}}
    function editState(id){const x=S.states.find(i=>i.state_id===id);if(!x)return;E.state=id;q("stateType").value=x.state_type;q("stateLabel").value=x.label||"";renderStateFeatureFields();Object.entries(x.features||{}).forEach(([k,v])=>{const el=document.querySelector(`#stateFeatures [data-key="${k}"]`);if(el)el.value=v})}
    async function deleteState(id){if(!confirm("确定删除这个状态吗？"))return;try{await req(`/states/${id}`,{method:"DELETE"});await loadStates();await loadSolveMachines();toast("success","状态已删除。")}catch(e){toast("error",e.message)}}
    function resetState(){E.state=null;q("stateType").value="current";q("stateLabel").value="";renderStateFeatureFields()}

    function featureOptions(mtId,selected=""){const defs=featureDefs(mtId);return defs.length?defs.map(f=>`<option value="${f.feature_key}" ${f.feature_key===selected?"selected":""}>${f.feature_name||f.feature_key}</option>`).join(""):`<option value="">请先配置特征</option>`}
    function addPre(v={}){q("preList").insertAdjacentHTML("beforeend",`<div class="item"><div class="row"><div><label>特征</label><select class="pk">${featureOptions(q("ruleType").value,v.feature_key||"")}</select></div><div><label>操作符</label><select class="po"><option value="eq" ${v.operator==="eq"?"selected":""}>等于</option><option value="neq" ${v.operator==="neq"?"selected":""}>不等于</option><option value="in" ${v.operator==="in"?"selected":""}>属于</option></select></div></div><div><label>值</label><input class="pv" value="${v.feature_value||""}"></div><div class="btns"><button class="danger small" onclick="this.closest('.item').remove()">删除</button></div></div>`)}
    function addEff(v={}){q("effList").insertAdjacentHTML("beforeend",`<div class="item"><div class="row"><div><label>特征</label><select class="ek">${featureOptions(q("ruleType").value,v.feature_key||"")}</select></div><div><label>执行后值</label><input class="ev" value="${v.new_value||""}"></div></div><div class="btns"><button class="danger small" onclick="this.closest('.item').remove()">删除</button></div></div>`)}
    function addReq(v={}){q("reqList").insertAdjacentHTML("beforeend",`<div class="item"><div class="row"><div><label>资源类型</label><input class="rk" value="${v.resource_type||""}"></div><div><label>数量</label><input class="rq" type="number" min="1" value="${v.quantity||1}"></div></div><div><label>是否必需</label><select class="rr"><option value="true" ${(v.is_required!==false)?"selected":""}>必需</option><option value="false" ${v.is_required===false?"selected":""}>可选</option></select></div><div class="btns"><button class="danger small" onclick="this.closest('.item').remove()">删除</button></div></div>`)}
    function refreshRuleFeatureSelects(){document.querySelectorAll(".pk").forEach(el=>{const v=el.value;el.innerHTML=featureOptions(q("ruleType").value,v);el.value=v});document.querySelectorAll(".ek").forEach(el=>{const v=el.value;el.innerHTML=featureOptions(q("ruleType").value,v);el.value=v})}
    function collect(selector,map){return [...document.querySelectorAll(selector)].map(map).filter(x=>Object.values(x).some(v=>v!==""&&v!==null))}
    async function loadRules(){const mtId=q("ruleListType").value;if(!mtId){S.rules=[];resetRule();q("ruleTable").innerHTML=`<tr><td colspan="2" class="empty">请先选择设备类型。</td></tr>`;return}S.rules=await req(`/machine-types/${mtId}/op-rules`);syncEditState("rule",S.rules,"id",resetRule);q("ruleTable").innerHTML=S.rules.length?S.rules.map(x=>`<tr><td><strong>${x.name}</strong><div class="muted">${x.code} · ${x.duration_min} min · 前置 ${x.preconditions.length} · 效果 ${x.effects.length} · 资源 ${x.resource_reqs.length}</div></td><td><button class="secondary small" onclick="editRule(${x.id})">编辑</button> <button class="danger small" onclick="deleteRule(${x.id})">删除</button></td></tr>`).join(""):`<tr><td colspan="2" class="empty">还没有活动。</td></tr>`}
    async function saveRule(){const mtId=Number(q("ruleType").value),p={machine_type_id:mtId,code:q("ruleCode").value.trim(),name:q("ruleName").value.trim(),duration_min:Number(q("ruleDuration").value||0),description:q("ruleDesc").value.trim()||null,is_active:true,preconditions:collect("#preList .item",x=>({feature_key:x.querySelector(".pk").value,operator:x.querySelector(".po").value,feature_value:x.querySelector(".pv").value.trim()})).filter(x=>x.feature_key&&x.feature_value),effects:collect("#effList .item",x=>({feature_key:x.querySelector(".ek").value,new_value:x.querySelector(".ev").value.trim()})).filter(x=>x.feature_key&&x.new_value),resource_reqs:collect("#reqList .item",x=>({resource_type:x.querySelector(".rk").value.trim(),quantity:Number(x.querySelector(".rq").value||1),is_required:x.querySelector(".rr").value==="true"})).filter(x=>x.resource_type)};if(!mtId||!p.code||!p.name||p.duration_min<1)return toast("error","请完整填写活动基本信息。");if(!p.effects.length)return toast("error","活动至少需要一个执行效果。");try{E.rule?await req(`/op-rules/${E.rule}`,{method:"PUT",body:JSON.stringify(p)}):await req(`/machine-types/${mtId}/op-rules`,{method:"POST",body:JSON.stringify(p)});resetRule();q("ruleListType").value=mtId;await loadRules();toast("success","活动已保存。")}catch(e){toast("error",e.message)}}
    function editRule(id){const x=S.rules.find(i=>i.id===id);if(!x)return;E.rule=id;q("ruleType").value=x.machine_type_id;q("ruleCode").value=x.code;q("ruleName").value=x.name;q("ruleDuration").value=x.duration_min;q("ruleDesc").value=x.description||"";q("preList").innerHTML="";q("effList").innerHTML="";q("reqList").innerHTML="";(x.preconditions.length?x.preconditions:[{}]).forEach(addPre);(x.effects.length?x.effects:[{}]).forEach(addEff);(x.resource_reqs.length?x.resource_reqs:[{}]).forEach(addReq)}
    async function deleteRule(id){if(!confirm("确定删除这个活动吗？"))return;try{await req(`/op-rules/${id}`,{method:"DELETE"});await loadRules();toast("success","活动已删除。")}catch(e){toast("error",e.message)}}
    function resetRule(){const mtId=q("ruleType").value||q("ruleListType").value;E.rule=null;q("ruleType").value=mtId||"";q("ruleCode").value="";q("ruleName").value="";q("ruleDuration").value=30;q("ruleDesc").value="";q("preList").innerHTML="";q("effList").innerHTML="";q("reqList").innerHTML="";addPre();addEff();addReq()}

    async function loadResources(){S.resources=await req("/resources");syncEditState("res",S.resources,"id",resetResource);q("resTable").innerHTML=S.resources.length?S.resources.map(x=>`<tr><td><strong>${x.name}</strong><div class="muted">${x.code} · ${x.resource_type} · 容量 ${x.capacity} · ${x.is_available?"可用":"不可用"}</div></td><td><button class="secondary small" onclick="editResource(${x.id})">编辑</button> <button class="danger small" onclick="deleteResource(${x.id})">删除</button></td></tr>`).join(""):`<tr><td colspan="2" class="empty">还没有资源。</td></tr>`}
    async function saveResource(){const p={code:q("resCode").value.trim(),name:q("resName").value.trim(),resource_type:q("resType").value.trim(),capacity:Number(q("resCap").value||1),is_available:q("resAvail").value==="true",meta:null};if(!p.code||!p.name||!p.resource_type)return toast("error","资源编码、名称、类型不能为空。");try{E.res?await req(`/resources/${E.res}`,{method:"PUT",body:JSON.stringify(p)}):await req("/resources",{method:"POST",body:JSON.stringify(p)});resetResource();await loadResources();toast("success","资源已保存。")}catch(e){toast("error",e.message)}}
    function editResource(id){const x=S.resources.find(i=>i.id===id);if(!x)return;E.res=id;q("resCode").value=x.code;q("resName").value=x.name;q("resType").value=x.resource_type;q("resCap").value=x.capacity;q("resAvail").value=x.is_available?"true":"false"}
    async function deleteResource(id){if(!confirm("确定删除这个资源吗？"))return;try{await req(`/resources/${id}`,{method:"DELETE"});await loadResources();toast("success","资源已删除。")}catch(e){toast("error",e.message)}}
    function resetResource(){E.res=null;q("resCode").value="";q("resName").value="";q("resType").value="";q("resCap").value=1;q("resAvail").value="true"}

    async function loadSolveMachines(){if(!S.ms.length)await loadMachines();setOptions("solveMachine",S.ms,"id",x=>`${x.name} (${x.code})`);pickFirst("solveMachine");if(q("solveMachine").value)await loadSolveStates()}
    async function loadSolveStates(){const machineId=q("solveMachine").value;if(!machineId){S.solveStates=[];q("solveCurrent").innerHTML=`<option value="">请先选择设备</option>`;q("solveTarget").innerHTML=`<option value="">请先选择设备</option>`;return}const d=await req(`/machines/${machineId}/states`);S.solveStates=d.states||[];const label=x=>`${x.label||"未命名状态"} (${Object.entries(x.features||{}).map(([k,v])=>`${k}:${v}`).join(" / ")})`;setOptions("solveCurrent",S.solveStates,"state_id",label,"请选择当前状态");setOptions("solveTarget",S.solveStates,"state_id",label,"请选择目标状态");pickFirst("solveCurrent");pickFirst("solveTarget");if(q("solveCurrent").value===q("solveTarget").value&&q("solveTarget").options.length>2)q("solveTarget").value=q("solveTarget").options[2].value}
    function renderGantt(tasks,makespan){if(!tasks.length||!makespan){q("gantt").innerHTML='<div class="empty">No schedule yet.</div>';return}const end=Math.max(makespan,...tasks.map(t=>t.end||0),1),step=end<=10?1:end<=40?5:10,ticks=Array.from({length:Math.floor(end/step)+1},(_,i)=>i*step),pct=v=>`${(v/end)*100}%`;const axis=`<div class="gantt-head"><div class="gantt-label">Timeline</div><div class="gantt-axis"><div class="gantt-ticks">${ticks.map(v=>`<div class="tick" style="left:${pct(v)}"><span>${v}</span></div>`).join("")}</div></div></div>`;const rows=tasks.slice().sort((a,b)=>(a.start-b.start)||(a.step-b.step)).map(t=>`<div class="gantt-row"><div class="gantt-label">Step ${t.step} ? ${t.op_code}<div class="muted">${t.resource||"Unassigned"} ? ${t.start}-${t.end} min</div></div><div class="gantt-track"><div class="gantt-bars"><div class="bar ${t.resource?"":"bar-idle"}" style="left:${pct(t.start)};width:${pct(Math.max(t.end-t.start,0.8))}"><span>${t.op_code}</span></div></div></div></div>`).join("");q("gantt").innerHTML=`<div class="gantt">${axis}${rows}</div>`}
    async function runSolve(){const p={machine_id:Number(q("solveMachine").value),current_state_id:Number(q("solveCurrent").value),target_state_id:Number(q("solveTarget").value),objective:q("solveObjective").value};if(!p.machine_id||!p.current_state_id||!p.target_state_id)return toast("error","请完整选择设备、当前状态和目标状态。");if(p.current_state_id===p.target_state_id)return toast("error","当前状态和目标状态不能相同。");try{const d=await req("/solve",{method:"POST",body:JSON.stringify(p)});if(d.status!=="done")return toast("error",`${d.error_code}: ${d.error_message}`);toast("success","求解完成。");q("makespan").textContent=d.schedule.makespan;q("tasks").innerHTML=d.schedule.tasks.map(t=>`<div class="item"><strong>Step ${t.step} · ${t.op_code}</strong><div class="muted">开始 ${t.start} min · 结束 ${t.end} min · 资源 ${t.resource||"未分配"}</div><div class="muted">前驱步骤：${(t.predecessors&&t.predecessors.length)?t.predecessors.join(", "):"无"}</div></div>`).join("");renderGantt(d.schedule.tasks||[],d.schedule.makespan||0);q("parallel").innerHTML=(d.schedule.parallel_groups&&d.schedule.parallel_groups.length)?d.schedule.parallel_groups.map(g=>`<span class="chip">并行步骤 ${g.join(" / ")}</span>`).join(""):`<div class="empty">没有检测到实际并行组。</div>`}catch(e){toast("error",e.message)}}

    function pickFirst(id){const el=q(id);if(!el.value&&el.options.length>1)el.value=el.options[1].value}
    async function reloadCore(){
      await loadMachineTypes();
      await loadMachines();
      await loadResources();
      ["mType","fdType","ruleType","ruleListType","stateMachine","solveMachine"].forEach(pickFirst);
      if(q("fdType").value)await loadFeatureDefs();else q("fdTable").innerHTML=`<tr><td colspan="2" class="empty">请先创建设备类型。</td></tr>`;
      renderStateFeatureFields();
      if(q("stateMachine").value)await loadStates();else q("stateTable").innerHTML=`<tr><td colspan="2" class="empty">请先创建设备。</td></tr>`;
      refreshRuleFeatureSelects();
      if(q("ruleListType").value)await loadRules();else q("ruleTable").innerHTML=`<tr><td colspan="2" class="empty">请先选择设备类型。</td></tr>`;
      if(q("solveMachine").value)await loadSolveStates();else{
        q("solveCurrent").innerHTML=`<option value="">请先创建设备</option>`;
        q("solveTarget").innerHTML=`<option value="">请先创建设备</option>`;
      }
    }
    async function init(){bindTabs();await health();resetRule();await reloadCore();setInterval(health,30000)}
    init().catch(e=>toast("error",e.message));
  </script>
</body>
</html>

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: solver_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-solver}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-solver123}
      POSTGRES_DB: ${DB_NAME:-solver_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-solver} -d ${DB_NAME:-solver_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: solver_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@solver.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    profiles:
      - admin

volumes:
  postgres_data:
    driver: local
